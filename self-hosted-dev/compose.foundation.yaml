# ==============================================================================
# IAOP Self-Hosted DEV — Foundation Infrastructure Compose
# Services: PostgreSQL 16, Keycloak 24, Kafka KRaft 3.7, Caddy Proxy, Swagger Portal
# Resource Target: AMD Ryzen 5, 16 GB RAM (Foundation Subtotal: ~4.0 GB)
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: iaop-postgres
    profiles: ["foundation", "all"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_secret_change_me}
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS:-100}
      POSTGRES_SHARED_BUFFERS: ${POSTGRES_SHARED_BUFFERS:-512MB}
      POSTGRES_WORK_MEM: ${POSTGRES_WORK_MEM:-16MB}
    command: >
      postgres
      -c max_connections=${POSTGRES_MAX_CONNECTIONS:-100}
      -c shared_buffers=${POSTGRES_SHARED_BUFFERS:-512MB}
      -c work_mem=${POSTGRES_WORK_MEM:-16MB}
      -c maintenance_work_mem=64MB
      -c effective_cache_size=1GB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
    ports:
      - "127.0.0.1:${PUBLIC_POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M
    networks:
      - iaop-data


  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: iaop-keycloak
    profiles: ["foundation", "all"]
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev_secret_change_me}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB:-iaop_keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_secret_change_me}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      JAVA_OPTS_KC_HEAP: "-Xms${KEYCLOAK_JVM_XMS:-256m} -Xmx${KEYCLOAK_JVM_XMX:-768m}"
    ports:
      - "127.0.0.1:${PUBLIC_KEYCLOAK_PORT:-8080}:8080"  # OIDC public access is via Caddy {$AUTH_HOST}
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 25s
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M
    networks:
      - iaop-edge
      - iaop-data


  kafka:
    image: apache/kafka:3.7.0
    container_name: iaop-kafka
    profiles: ["foundation", "all"]
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,EXTERNAL://localhost:${PUBLIC_KAFKA_PORT:-9092}'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS:-48}
      KAFKA_LOG_SEGMENT_BYTES: ${KAFKA_LOG_SEGMENT_BYTES:-104857600}
      KAFKA_LOG_RETENTION_BYTES: ${KAFKA_LOG_RETENTION_BYTES:-5368709120}
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-4L622nShTUiTwyvCdLfZ2w}
      KAFKA_HEAP_OPTS: ${KAFKA_JVM_OPTS:--Xmx768m -Xms256m}
    ports:
      - "127.0.0.1:${PUBLIC_KAFKA_PORT:-9092}:9094"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-cluster.sh cluster-id --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M
    networks:
      - iaop-data


  iaop-developer-portal:
    build:
      context: ../../iaop-api-contracts
      dockerfile: Dockerfile
    image: iaop-api-contracts:latest
    container_name: iaop-developer-portal
    profiles: ["foundation", "all"]
    restart: unless-stopped
    environment:
      PORT: 8080
      RUST_LOG: info
      CATALOG_PATH: /app/catalog/services.yaml
      SWAGGER_VALIDATOR_URL: "none"
      SWAGGER_TRY_IT_OUT_ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    networks:
      - iaop-edge
      - iaop-domain


  caddy:
    image: caddy:2.8-alpine
    container_name: iaop-caddy
    profiles: ["foundation", "all"]
    restart: unless-stopped
    ports:
      - "${PUBLIC_GATEWAY_PORT:-80}:80"
    environment:
      AGENT_HOST: ${AGENT_PUBLIC_HOST:-agent.localhost}
      PORTAL_HOST: ${PORTAL_PUBLIC_HOST:-portal.localhost}
      AUTH_HOST: ${AUTH_PUBLIC_HOST:-auth.localhost}
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      iaop-developer-portal:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    networks:
      - iaop-edge


  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: iaop-cloudflared
    profiles: ["cloudflared"]
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    volumes:
      - ./cloudflare/config.yml:/etc/cloudflared/config.yml:ro
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    networks:
      - iaop-edge

