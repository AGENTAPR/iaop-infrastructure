# ==============================================================================
# IAOP Self-Hosted DEV — Observability Compose
# Services: OpenTelemetry Collector, Prometheus (Metrics & Alerting)
# Resource Target: AMD Ryzen 5, 16 GB RAM (Observability Subtotal: ~1.4 GB)
# ==============================================================================

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.98.0
    container_name: iaop-otel-collector
    profiles: ["observability", "all"]
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M
    networks:
      - iaop-internal

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: iaop-prometheus
    profiles: ["observability", "all"]
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-7d}"
      - "--storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-15GB}"
      - "--web.enable-lifecycle"
    ports:
      - "${PUBLIC_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M
    networks:
      - iaop-internal
