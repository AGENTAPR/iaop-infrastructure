# Default-deny ingress/egress for the iaop namespace.
# Add explicit NetworkPolicies per service as deployments are defined.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: iaop
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# Allow DNS egress (required for service discovery / external lookups).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: iaop
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
