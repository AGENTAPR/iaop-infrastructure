apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: iaop-developer-portal
  namespace: iaop
  labels:
    app.kubernetes.io/name: iaop-developer-portal
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: iaop-developer-portal
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from ingress controller and internal cluster probes
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow DNS resolution only (service is self-contained and static)
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
