# IAOP shared-dev edge: public OIDC surface only.
# Admin console, master realm, and management endpoints are NOT proxied.
# Admin access: SSH tunnel to the box's 127.0.0.1:8081 (keycloak direct).

upstream keycloak {
    server keycloak:8080;
}

server {
    listen 8080;
    server_name _;

    # Keycloak public auth surface for realm iaop-dev:
    #  - OIDC discovery + tokens + JWKS + userinfo + logout + certs
    #  - login actions + account console + theme resources
    location ~ ^/realms/iaop-dev/(\.well-known|protocol/openid-connect|account|login-actions) {
        proxy_pass http://keycloak;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Port 443;
    }

    location /resources/ {
        proxy_pass http://keycloak;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Explicit denials (defense in depth; unmatched paths 404 anyway)
    location ~ ^/(admin|realms/master|js|metrics) {
        return 404;
    }

    location / {
        return 404;
    }
}
